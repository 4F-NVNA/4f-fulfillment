<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фулфилмент FBO/FBS в Москве | 4F Fulfillment</title>
    <style>
        /* Базовые настройки */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333; }
        
        /* Шапка */
        header { background: #111; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 800; letter-spacing: 1px; }
        .logo span { color: #FF6600; }
        .header-contact { display: flex; align-items: center; gap: 15px; }
        .phone { font-weight: 600; text-decoration: none; color: #fff; font-size: 16px; }
        .btn-tg { background: #FF6600; color: #fff; padding: 10px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 14px; transition: 0.3s; }
        .btn-tg:hover { background: #e65c00; }

        /* Первый экран (Hero) */
        .hero { position: relative; min-height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 40px 20px; background-image: url('sklad.jpg'); background-size: cover; background-position: center; }
        /* Затемнение фона, чтобы текст читался */
        .hero::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); z-index: 1; }
        
        .hero-content { position: relative; z-index: 2; max-width: 900px; }
        .hero h1 { font-size: 42px; color: #fff; margin-bottom: 20px; line-height: 1.2; text-transform: uppercase; }
        .hero h1 span { color: #FF6600; }
        .hero p { font-size: 20px; color: #ddd; margin-bottom: 40px; line-height: 1.5; }
        
        /* Главная кнопка */
        .btn-main { display: inline-block; background: #FF6600; color: #fff; padding: 20px 40px; font-size: 20px; font-weight: 800; text-decoration: none; border-radius: 8px; text-transform: uppercase; box-shadow: 0 4px 15px rgba(255, 102, 0, 0.4); transition: 0.3s; }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(255, 102, 0, 0.6); }

        /* Адаптация под телефоны */
        @media (max-width: 768px) {
            .hero h1 { font-size: 32px; }
            .hero p { font-size: 16px; }
            .header-contact { flex-direction: column; align-items: flex-end; gap: 5px; }
            .phone { font-size: 14px; }
            .btn-tg { font-size: 12px; padding: 8px 12px; }
            .btn-main { font-size: 18px; padding: 15px 25px; width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Шапка сайта -->
    <header>
        <div class="logo">4F<span>FULFILLMENT</span></div>
        <div class="header-contact">
            <!-- ЗАМЕНИ НОМЕР ТЕЛЕФОНА НИЖЕ -->
            <a href="tel:+79776946400" class="phone">+7 (977) 694-64-00</a>
            <!-- ЗАМЕНИ ССЫЛКУ НА ТГ НИЖЕ -->
            <a href="https://t.me/FirstFamilyFulFillment" class="btn-tg">Написать в TG</a>
        </div>
    </header>

    <!-- Первый экран -->
    <section class="hero">
        <div class="hero-content">
            <h1>Фулфилмент FBO/FBS <br><span>в Москве. Склад в Домодедово</span></h1>
            <p>Принимаем товар от 100 единиц. <strong>Первая приемка — БЕСПЛАТНО.</strong><br>Работаем в WMS «Целиком». Штрафы за просрочку — наша ответственность.</p>
            
            <!-- Кнопка ведет на форму (пока просто якорь) -->
            <a href="#contact-form" class="btn-main">Рассчитать стоимость за 15 минут</a>
        </div>
    </section>

</body>
</html>
